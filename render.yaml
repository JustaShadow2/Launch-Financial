services:
  - type: web
    name: launch-financial
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres connection string (pooled). Set in the Render dashboard.
      # Real user accounts persist here across deploys.
      - key: DATABASE_URL
        sync: false
      # Optional: Neon direct (non-pooled) connection string for migrations.
      - key: DIRECT_URL
        sync: false
      # JWT signing secret. Render generates a strong random value.
      - key: JWT_SECRET
        generateValue: true
      # Market data providers. Set these in the Render dashboard: Finnhub powers
      # symbol search + stock/ETF quotes; Twelve Data powers crypto + charts.
      - key: FINNHUB_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      # Email for password-reset codes (Resend). If unset, codes are logged to
      # the service logs instead of emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Learning coach chatbot (Groq LLM). Same key/model as the AI-Chef
      # project. If unset, the Coach tab is shown as unavailable.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
